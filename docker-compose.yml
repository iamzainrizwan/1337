services:
  1337:
    build: .
    container_name: 1337
    restart: unless-stopped
    ports:
      - "5150:5000"
    volumes:
      - ./data:/data
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DIGEST_TO_EMAIL=${DIGEST_TO_EMAIL}
      - DIGEST_FROM_EMAIL=${DIGEST_FROM_EMAIL:-onboarding@resend.dev}
      - DIGEST_SEND_TIME=${DIGEST_SEND_TIME:-07:00}
      - TZ=${TZ:-Europe/London}
